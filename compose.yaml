services:
  
  #Jaeger Service
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI Jaeger
      - "6831:6831/udp" # Thrift over UDP
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    volumes:
      - jaeger-data:/data # Сохраняем данные Jaeger

  # Prometheus Service
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus # Сохраняем данные Prometheus
    depends_on:
      - WebApi1Telemetry
  
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana # Сохраняем данные Grafana
    depends_on:
      - prometheus
  
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webapi1tel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --requirepass "yourpassword"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # .NET Application
  WebApi1Telemetry:
    #    image: webapi1telemetry
    build:
      context: .
      dockerfile: WebApi1Telemetry/Dockerfile
    ports:
      #      - "5001:443"
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_JAEGER_AGENT_HOST=jaeger
      - OTEL_EXPORTER_JAEGER_AGENT_PORT=6831
      #- ASPNETCORE_URLS=https://+;http://+
    #      - ASPNETCORE_HTTPS_PORT=8005
    depends_on:
      - jaeger
      - postgres
  
  # .NET Application
  WebApi2Telemetry:
    #    image: webapi1telemetry
    build:
      context: .
      dockerfile: WebApi2Telemetry/Dockerfile
    ports:
      #      - "5001:443"
      - "5010:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      #      - OTEL_EXPORTER_JAEGER_AGENT_HOST=jaeger
      #      - OTEL_EXPORTER_JAEGER_AGENT_PORT=6831
      #- ASPNETCORE_URLS=https://+;http://+
    #      - ASPNETCORE_HTTPS_PORT=8005

volumes:
  jaeger-data: # Volume для Jaeger
  prometheus-data: # Volume для Prometheus
  grafana-data: # Volume для Grafana  
  postgres_data: # Volume для Postgres
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local